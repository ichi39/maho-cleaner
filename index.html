<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔法のお掃除屋さん</title>
<style>
:root{--plum:#6a4a62;--gold:#d9a845;--cream:#fff6e6;--pink:#f6c9c9;--mint:#bfe3c8;--lav:#cfc6ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#2a2550;overflow:hidden;color:var(--plum);touch-action:manipulation;
 font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif;font-weight:700}
#app{position:relative;height:100vh;height:100dvh;max-width:900px;margin:0 auto;overflow:hidden;background:var(--cream)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.btn{border:3px solid var(--gold);background:linear-gradient(#fffaf0,#ffe9c8);color:var(--plum);font:inherit;font-size:clamp(16px,4.6vw,22px);
 padding:.6em 1.6em;border-radius:999px;box-shadow:0 4px 0 #c79a3c,inset 0 0 0 2px #fff;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c79a3c,inset 0 0 0 2px #fff}
.btn.sm{font-size:15px;padding:.35em 1em}
.btn.pink{background:linear-gradient(#fff0f4,#ffd0de)}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
.bar h2{margin:0;font-size:clamp(17px,4.5vw,24px);text-align:center;flex:1}
/* title */
#cTitle{position:absolute;inset:0;width:100%;height:100%}
#title .box{position:relative;margin-top:9vh;text-align:center;padding:0 12px}
#title .sub{font-size:clamp(13px,3.4vw,18px);color:#fff;text-shadow:0 2px 0 #b07aa8;letter-spacing:.3em}
#title h1{margin:.1em 0;font-size:clamp(32px,9vw,60px);color:#fffaf0;letter-spacing:.04em;
 text-shadow:2px 2px 0 #d87aa0,-2px -2px 0 #d87aa0,2px -2px 0 #d87aa0,-2px 2px 0 #d87aa0,0 5px 0 #b05a86,0 0 18px #fff}
#title .tag{font-size:clamp(13px,3.6vw,18px);color:#fff;text-shadow:0 2px 0 #b07aa8}
#title .btns{position:absolute;left:0;right:0;bottom:7vh;display:flex;flex-direction:column;align-items:center;gap:14px}
/* stages */
#stages{background:linear-gradient(#fdeef2,#eaf6f0)}
.tabs{display:flex;gap:10px;margin-bottom:4px}
.tab{opacity:.55}.tab.on{opacity:1;background:linear-gradient(#ffe9f0,#ffc4d6)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;width:100%;overflow:auto;flex:1;align-content:start}
.card{border:3px solid var(--gold);border-radius:16px;background:var(--cream);padding:10px;text-align:center;cursor:pointer;
 box-shadow:inset 0 0 0 3px #fff,0 4px 0 #e2c27a;position:relative}
.card:active{transform:translateY(2px)}
.card canvas{width:72px;height:72px}
.card b{display:block;font-size:clamp(14px,3.8vw,18px)}
.card small{display:block;font-size:12px;color:#a07a98}
.card .star{position:absolute;top:4px;right:8px;font-size:22px;color:#f3b516;text-shadow:0 1px 0 #fff}
/* room */
#room{background:#2a2550}
#rc{width:100%;max-height:62vh;max-height:62dvh;object-fit:contain;background:#2a2550;touch-action:none}
.info{color:#fff;text-align:center;padding:8px;font-size:15px}
.dlg{position:absolute;left:10px;right:10px;bottom:12px;background:var(--cream);border:4px solid var(--gold);border-radius:18px;padding:12px;
 display:none;gap:12px;align-items:center;box-shadow:inset 0 0 0 3px #fff,0 6px 0 rgba(0,0,0,.25);flex-wrap:wrap;justify-content:center}
.dlg.on{display:flex}
.dlg canvas{width:96px;height:96px;flex:none}
.dlg p{white-space:pre-line;margin:0;flex:1;min-width:200px;line-height:1.6;font-size:clamp(14px,3.8vw,18px)}
.dlg .who{color:#d0607a;font-size:.85em}
#clear .letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.chip{background:#fff;border:2px solid var(--gold);border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:24px}
/* puzzle */
#puzzle{background:linear-gradient(#fdf3e8,#f3e4f4)}
#pz{width:min(94vw,520px);height:auto;aspect-ratio:150/120;margin-top:4px;touch-action:none}
#slots{display:flex;gap:8px;justify-content:center;margin:8px 0;padding:0 8px}
.slot{width:min(15vw,64px);height:min(15vw,64px);border:3px dashed #d9a845;border-radius:14px;background:rgba(255,255,255,.7);
 display:flex;align-items:center;justify-content:center;font-size:min(9vw,38px);color:rgba(106,74,98,.22)}
.slot.ok{border-style:solid;background:#fff;color:var(--plum);animation:pop .4s}
.slot.hot{background:#fff1b8;transform:scale(1.08)}
#tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px 12px;max-width:560px;touch-action:none}
.tile{width:min(17vw,70px);height:min(17vw,70px);border-radius:16px;background:linear-gradient(#fffdf6,#ffe8c0);border:3px solid var(--gold);
 box-shadow:0 4px 0 #c79a3c,inset 0 0 0 2px #fff;display:flex;align-items:center;justify-content:center;font-size:min(10.5vw,44px);
 cursor:grab;touch-action:none;position:relative}
.tile.drag{z-index:50;box-shadow:0 12px 14px rgba(0,0,0,.25);transition:none}
.tile.used{visibility:hidden}
.tile.back{transition:transform .25s}
.tile.shake{animation:shake .35s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{25%{margin-left:-8px}75%{margin-left:8px}}
/* zukan */
#zukan{background:linear-gradient(#eaf0fb,#fdeef2)}
.zwrap{overflow:auto;flex:1;width:100%;padding:0 12px 20px}
.zwrap h3{margin:12px 0 6px;text-align:center}
.zg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:420px;margin:0 auto}
.zc{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,30px);
 background:rgba(255,255,255,.5);color:rgba(106,74,98,.25);border:2px solid transparent;cursor:pointer}
.zc.on{background:#fff;color:var(--plum);border-color:var(--gold);box-shadow:0 2px 0 #e2c27a}
.zc.e{visibility:hidden}
#shelf{background:linear-gradient(#eaf0fb,#fdeef2)}
#reqList{display:flex;gap:10px;overflow-x:auto;padding:10px 12px;width:100%;flex:1;align-items:flex-start}
.rcard{flex:none;width:136px;border:3px solid var(--gold);border-radius:16px;background:var(--cream);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:inset 0 0 0 3px #fff,0 4px 0 #e2c27a}
.rcard.new{animation:pop .5s}
.rcard:active{transform:translateY(2px)}
.rcard .top{display:flex;align-items:center;gap:4px}
.rcard .top canvas{width:56px;height:56px}
.rcard .mini{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.rcard .mini canvas{width:28px;height:28px}
.gift{display:flex;align-items:center;gap:8px;justify-content:center;width:100%;font-size:15px}
.gift canvas{width:64px;height:64px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:0 auto;padding-top:8px}
.sc{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;padding:4px;cursor:pointer}
.sc.on{background:#fff;border:2px solid var(--gold)}
.sc canvas{width:100%;height:100%;opacity:.45}
.sc.on canvas{opacity:1}
.sc.bump{animation:pop .4s}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f3c850 60%,#d9a845);border:2px solid #c08f3a;vertical-align:-3px;margin-right:3px}
.coin.big{width:26px;height:26px}
.gift{font-size:20px;color:#c08f3a}
#buyBar{width:100%;min-height:92px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--cream);border-top:3px solid var(--gold)}
#buyBar canvas{width:64px;height:64px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:8px}
.sws{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:250px}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d9a845;padding:0;cursor:pointer;position:relative}
.sw.off{background:repeating-linear-gradient(45deg,#e8e0e0 0 4px,#f6f0f0 4px 8px);opacity:.6;cursor:default}
.sw.sel{transform:scale(1.25);box-shadow:0 0 0 3px #e8607a}
.sw.own::after{content:'♥';position:absolute;right:-6px;top:-8px;font-size:11px;color:#e8607a}
.sc .dots{position:absolute;left:3px;bottom:3px;display:flex;gap:1px;flex-wrap:wrap;max-width:60%}
.sc .dots i{width:6px;height:6px;border-radius:50%;border:1px solid rgba(106,74,98,.4)}
#buyBar .btn[disabled]{opacity:.5}
.sc{position:relative;flex-direction:column}
.sc.sel{outline:3px solid #f08aa8}
.sc .pr{position:absolute;bottom:2px;right:4px;font-size:12px;color:#8a6a4a}
.sc .ok{position:absolute;top:2px;right:4px;font-size:14px;color:#e8607a}
.cvwrap{position:relative;width:min(100%,calc(62dvh * 1.6));margin:0 auto}
.cvwrap canvas{width:100%;height:auto;display:block;background:#2a2550;touch-action:none}
.arrow{position:absolute;left:6px;top:42%;width:46px;height:46px;border-radius:50%;border:3px solid #c08f3a;background:radial-gradient(circle at 35% 30%,#fff6a0,#ffd84a 65%,#e8b830);color:var(--plum);font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #c79a3c;animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateX(-5px)}}
.sbub{position:absolute;display:none;max-width:62%;background:#fff;border:3px solid var(--gold);border-radius:14px;padding:6px 10px;font-size:clamp(15px,4.2vw,19px);line-height:1.55;color:var(--plum);pointer-events:none;bottom:36%;transform:translateX(-50%);animation:pop .3s}
.sbub.on{display:block}
.sbub::after{content:"";position:absolute;bottom:-11px;left:var(--tl,50%);width:14px;height:14px;background:#fff;border-right:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:translateX(-50%) rotate(45deg)}
.rbub{display:none;align-items:center;gap:10px;width:calc(100% - 20px);margin:8px 10px 0;background:var(--cream);border:4px solid var(--gold);border-radius:16px;padding:8px 10px;box-shadow:inset 0 0 0 3px #fff;font-size:clamp(14px,3.8vw,17px);line-height:1.5;position:relative}
.rbub.on{display:flex}
.rbub canvas{width:72px;height:72px;flex:none}
.rbub .who{color:#d0607a;font-size:.85em}
.rbub em{display:block;font-style:normal;color:#e8607a;margin-top:2px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#mineTray{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;overflow:auto;width:100%;flex:1;align-content:flex-start;justify-content:center}
#mineTray canvas{width:46px;height:46px;background:rgba(255,255,255,.15);border-radius:10px;padding:2px;cursor:pointer}
.sg{grid-template-columns:repeat(6,1fr)!important;gap:6px!important;max-width:540px!important}
.back{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid #c08f3a;background:radial-gradient(circle at 35% 30%,#fff6a0,#ffd84a 65%,#e8b830);color:var(--plum);font:inherit;font-size:22px;padding:0;line-height:1;cursor:pointer;box-shadow:0 3px 0 #c79a3c,inset 0 0 0 2px #fff7c0}
.back,.arrow{font-size:0!important}
.back::before,.arrow::before{content:'';display:block;width:20px;height:20px;margin:auto;background:#6a4a62;clip-path:polygon(72% 6%,72% 94%,8% 50%);border-radius:2px}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 #c79a3c}
.shopbtn{flex:none;width:52px;height:46px;border-radius:16px;border:3px solid var(--gold);background:linear-gradient(#fff0f4,#ffd0de);padding:0;cursor:pointer;box-shadow:0 3px 0 #c79a3c,inset 0 0 0 2px #fff}
.shopbtn canvas{width:38px;height:38px;margin-top:1px}
.reset{position:absolute;right:8px;bottom:6px;background:none;border:0;color:#fff;opacity:.35;font:inherit;font-size:11px;padding:6px;cursor:pointer;z-index:2}
.locked{opacity:.75}
.shopbtn.shake,#bShelf.shake{animation:shake .35s}
.trow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%;justify-content:flex-start;background:rgba(255,255,255,.1);border-radius:12px;padding:4px 6px}
#mineTray canvas.ricon{width:40px;height:40px;background:#ffe27a;border-radius:50%;padding:3px}
#mineTray canvas.worn{outline:3px solid #ffe27a;background:rgba(255,226,122,.3)}
.modal{position:absolute;inset:0;background:rgba(20,15,50,.62);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mcard{background:var(--cream);border:4px solid var(--gold);border-radius:22px;padding:18px 16px;max-width:380px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:inset 0 0 0 3px #fff,0 8px 0 rgba(0,0,0,.25);text-align:center;position:relative}
.mcard>canvas{width:120px;height:120px}
.mtxt .who{color:#d0607a;font-size:.95em}
.mtxt p,.mcard>p{margin:4px 0 0;white-space:pre-line;line-height:1.7;font-size:clamp(16px,4.4vw,20px)}
.btn.big{font-size:clamp(18px,5vw,24px);padding:.6em 1.8em;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.arrow.right{left:auto;right:6px;animation:nudgeR 1s infinite}
@keyframes nudgeR{50%{transform:translateX(5px)}}
.arrow.right::before{clip-path:polygon(28% 6%,28% 94%,92% 50%)}
#tut{z-index:60}
.tpics{display:flex;align-items:center;justify-content:center;gap:10px;min-height:84px;flex-wrap:wrap}
.tpics canvas{width:64px;height:64px}
.tpics .tile,.tpics .slot{width:56px;height:56px;font-size:30px;cursor:default;animation:none}
.tri{width:24px;height:24px;background:var(--gold);clip-path:polygon(15% 5%,15% 95%,95% 50%)}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#e3d3b8}.dots i.on{background:var(--gold)}
.skip2{position:absolute;top:6px;right:10px;background:none;border:0;color:#a08a8a;font:inherit;font-size:13px;padding:6px;cursor:pointer}
#finger{position:absolute;left:0;top:0;width:48px;height:48px;z-index:40;pointer-events:none}
#finger canvas{width:48px;height:48px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.shopbtn.pulse{animation:pulse 1s infinite}
#pzwrap{position:relative;width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center}
#pz{height:min(calc(94vw*.8),36dvh);width:auto;aspect-ratio:150/120;margin-top:4px;touch-action:none;flex:none}
#lc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.lt{font-size:48px;font-weight:800;color:#ff8fb0;-webkit-text-stroke:0;text-shadow:2px 2px 0 #6a4a62,-2px -2px 0 #6a4a62,2px -2px 0 #6a4a62,-2px 2px 0 #6a4a62;animation:wig 1.4s infinite}
.lg{font-size:48px;font-weight:800;color:rgba(106,74,98,.22)}
@keyframes wig{25%{transform:rotate(-6deg) scaleX(1.06)}75%{transform:rotate(6deg) scaleX(.95)}}
.hqitems{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap;background:rgba(106,74,98,.08);border-radius:12px;padding:4px 8px}
.hqitems canvas{width:40px;height:40px}.hqitems canvas:first-child{width:48px;height:48px;margin-right:6px}
.hqrow{display:flex;gap:12px}
.btn.gray{background:linear-gradient(#f4f0f0,#ddd4d4);border-color:#b8a8a8;box-shadow:0 4px 0 #a89898,inset 0 0 0 2px #fff}
#homeInfo.coinpop{animation:pop .5s}
.stabs{display:flex;gap:10px;justify-content:center;padding:0 12px 6px}
.stab{display:flex;align-items:center;gap:6px;border:3px solid #d8c8b0;background:rgba(255,255,255,.6);border-radius:16px;padding:4px 14px 4px 6px;font:inherit;font-size:15px;color:var(--plum);cursor:pointer;opacity:.7}
.stab.on{border-color:var(--gold);background:linear-gradient(#fffaf0,#ffe9c8);opacity:1;box-shadow:0 3px 0 #c79a3c}
.stab canvas{width:40px;height:40px}
#diary{z-index:50}
.book{position:relative;width:100%;max-width:400px;max-height:92%;display:flex;flex-direction:column;background:repeating-linear-gradient(#fffaf0 0 27px,#f0e2c8 27px 28px);border:5px solid #8a5a3a;border-left-width:14px;border-radius:10px 18px 18px 10px;box-shadow:inset 0 0 0 3px #f3c850,0 8px 0 rgba(0,0,0,.3);padding:14px 14px 10px}
.dx{position:absolute;top:4px;right:6px;border:0;background:none;font-size:22px;color:#8a5a3a;cursor:pointer;padding:6px}
.dpage{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:300px}
.dpage h3{margin:2px 0;font-size:clamp(22px,6vw,30px);color:#8a5a3a}
.dsub{margin:0;color:#a07a58}
.dday{margin:0;align-self:flex-start;color:#c08f3a;font-size:15px}
.dtxt{margin:0;font-size:clamp(16px,4.6vw,20px);line-height:1.75;white-space:pre-line}
.dbig{width:120px;height:120px}
.dgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%}
.dgrid canvas{width:100%;aspect-ratio:1;background:rgba(255,255,255,.6);border-radius:8px;cursor:pointer}
.dwho{display:flex;align-items:center;gap:6px;text-align:left;font-size:15px;line-height:1.6;background:rgba(255,255,255,.6);border-radius:12px;padding:4px 8px}
.dwho canvas{width:48px;height:48px;flex:none}
.dnav{display:flex;align-items:center;justify-content:space-between;padding-top:8px}
.back.fwd::before{clip-path:polygon(28% 6%,28% 94%,92% 50%)}
.closebtn{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(#4a4a9a,#2e2e70);color:#ffe9a0;border-color:#f3c850;box-shadow:0 4px 0 #1c1c50,inset 0 0 0 2px #6a6ac0}
.closebtn.big{animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{transform:translateX(-50%) scale(1.06)}}
.nightcard{background:linear-gradient(#2e2e70,#4a3a8a);color:#fff6e6;border-color:#f3c850;box-shadow:inset 0 0 0 3px #6a6ac0,0 8px 0 rgba(0,0,0,.3)}
.nightcard h2{margin:0;color:#ffe9a0;font-size:clamp(22px,6vw,30px)}
.nightcard .dl{margin:4px 0 0;font-size:15px;color:#d8d0ff}
.drow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;background:rgba(255,255,255,.1);border-radius:12px;padding:4px 8px;min-height:44px;align-items:center;max-width:100%}
.drow canvas{width:44px;height:44px}
.nightcard .gift{color:#ffe27a}
#dawn{position:absolute;inset:0;pointer-events:none;z-index:70;background:radial-gradient(circle at 50% 30%,#fffbe0,#ffe6b0);opacity:0}
#dawn.go{animation:dawn 1.6s ease-out}
@keyframes dawn{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
 <section id="title" class="screen on">
  <canvas id="cTitle"></canvas>
  <div class="box"><div class="sub">まほうの おそうじ ものがたり</div><h1>魔法のお掃除屋さん</h1><div class="tag">ばらばらの ものを なおして、おみせを ぴかぴかに!</div></div>
  <button id="bReset" class="reset">はじめから</button>
  <div class="btns"><button class="btn" id="bStart">はじめる ▶</button><button class="btn pink" id="bShelf"><canvas class="ico" width="24" height="24" style="width:44px;height:44px;vertical-align:middle"></canvas></button><button class="btn sm" id="bSnd">おと: ON</button><div id="voiceNote" style="display:none;font-size:12px;color:#fff;background:rgba(106,74,98,.6);padding:4px 10px;border-radius:10px;max-width:280px;text-align:center">この たんまつには にほんごの よみあげが ないようです</div></div>
 </section>
 <section id="home" class="screen" style="background:#2a2550">
  <div class="bar" style="background:#2a2550"><span id="homeInfo" style="color:#ffe27a"></span><button class="shopbtn" data-go="shelf"><canvas class="ico" width="24" height="24"></canvas></button></div>

    else{const dx=c.tx-c.x;c.x+=dx*Math.min(1,dt*2.5);if(Math.abs(dx)<.5)c.x=c.tx;walking=Math.abs(c.tx-c.x)>3;}

}

  $('#dayEnd').classList.add('on');fanfare();
}
$('#bCloseShop').addEventListener('click',()=>{initAudio();$('#bCloseShop').style.display='none';$('#hbub').classList.remove('on');H.talk=null;showDayEnd();});
$('#bMorning').addEventListener('click',()=>{
  initAudio();const D=DAY();
  save.day=newDay(D.n+1,shuffle([...new Set(D.met)]).slice(0,3));lampOn=false;persist();
  $('#dayEnd').classList.remove('on');
  const fl=$('#dawn');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
  sfx('fan');onShow.home();setTimeout(()=>talk(WITCH,'おはよう! きょうも がんばろうね。',3.5),300);
});
/* ========= ボタン・メインループ ========= */
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>{initAudio();if(b.dataset.go==='shelf'&&!canShop()){boo();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}show(b.dataset.go);}));
const TUT=[
  {t:'おきゃくさんが きたら タップして、おしごとを うけよう',pics:()=>[cvOf(spr('person',{hair:'#c98a5a',dress:'#e58fa5'}).c),tri(),cvOf(spr('lamp',{c:'#f5b0c8'}).g)]},
  {t:'ぴかぴか ひかる こわれた ものを タップして なおそう',pics:()=>[cvOf(spr('kettle',{c:'#e0a0c0'}).g),tri(),cvOf(spr('kettle',{c:'#e0a0c0'}).c)]},
  {t:'もじを ゆびで ひっぱって、うすい もじの ところに はめよう',pics:()=>[tileEl('あ','lt'),tri(),tileEl('あ','lg')]},
  {t:'もらった おかねで かいものを して、おへやや にんぎょうを かざろう',pics:()=>[coinEl(),tri(),cvOf(spr('basket').c),tri(),cvOf(spr('doll').c)]}
];
const tri=()=>{const d=document.createElement('div');d.className='tri';return d;};
const tileEl=(ch,cls)=>{const d=document.createElement('div');d.className=cls;d.textContent=ch;return d;};
const coinEl=()=>{const d=document.createElement('span');d.className='coin big';return d;};
let tutI=0,tutDone=null;
function showTut(){
  const st=TUT[tutI],pics=$('#tPics');pics.innerHTML='';st.pics().forEach(e=>pics.appendChild(e));
  $('#tText').textContent=st.t;$('#tDots').innerHTML=TUT.map((_,i)=>`<i class="${i===tutI?'on':''}"></i>`).join('');
  $('#bTutNext').textContent=tutI<TUT.length-1?'つぎへ ▶':'はじめる ▶';
}
function startTut(done){tutI=0;tutDone=done;$('#tut').classList.add('on');showTut();}
function endTut(){$('#tut').classList.remove('on');save.tut=true;persist();tutDone&&tutDone();}
$('#bTutNext').addEventListener('click',()=>{initAudio();chime(tutI+2);if(tutI<TUT.length-1){tutI++;showTut();}else endTut();});
$('#bTutSkip').addEventListener('click',endTut);
$('#bStart').addEventListener('click',()=>{initAudio();chime(2);if(!save.tut)startTut(()=>show('home'));else show('home');});
$('#bShelf').addEventListener('click',()=>{initAudio();if(!canShop()){boo();const b=$('#bShelf');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}show('shelf');});
$('#bSnd').addEventListener('click',()=>{initAudio();unlockTTS();setSound(!soundOn);if(soundOn)say('おとが でるよ');});
$('#bRoomBack').addEventListener('click',()=>{$('#clear').classList.remove('on');show('home');});
$('#bPzBack').addEventListener('click',()=>{stopFinger();stopVoice(true);drag=null;P.tok++;show('room');updateRoomHud();});
$('#bHear').addEventListener('click',()=>{initAudio();say(P.word);});
$('#bClNext').addEventListener('click',()=>{initAudio();leaveClient();});
const canShop=()=>Object.keys(save.got).length>0;
function refreshLocks(){
  const ok=canShop();
  $$('canvas.ico').forEach(c=>{const x=c.getContext('2d');x.clearRect(0,0,24,24);x.drawImage(ok?spr('basket').c:spr('basket').g,0,0);if(!ok)x.drawImage(spr('lock').c,10,9,15,15);});
  $$('.shopbtn,#bShelf').forEach(b=>b.classList.toggle('locked',!ok));
  $$('.shopbtn').forEach(b=>b.classList.toggle('pulse',ok&&!save.shopSeen));
}
onShow.title=refreshLocks;
refreshLocks();
$('#bReset').addEventListener('click',()=>{const ans=prompt('ぜんぶ きえて さいしょから やりなおします。\nやりなおすなら「はい」と いれてね');if(ans!==null&&ans.trim()==='はい'){try{localStorage.removeItem('maho-cleaner-3');}catch(e){}location.reload();}});
setSound(soundOn);
updateVoiceNote();setTimeout(()=>{pickVoice();updateVoiceNote();},1500);
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;const t=ts/1000;
  if(screen==='title')drawTitle(t);else if(screen==='home')drawHome(t,dt);else if(screen==='mine')drawMine(t,dt);else if(screen==='room')drawRoom(t,dt);else if(screen==='puzzle')drawPuzzle(t,dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
