<main>
  <h2>1. どうぶつ 3案</h2>
  <p class="note">体(胴・うで・足)は3案とも同じ寸法で、あたま・みみ・しっぽだけが違います。服は寸法から計算して描くので、3案ともそのまま着られます。右の小さい絵は「ゲームでの大きさ」で描いたものです。</p>

  <h2>3. ぜんぶ ならべる(服・くつ 1着ずつ)</h2>
  <p class="note">各アイテムを、はだかのどうぶつに1つだけ着せています。ずれ・はみ出し・足りない所を探すための表です。</p>

<script>
'use strict';
/* =========================================================
   どうぶつ にんぎょう ラボ(32x32 ドット)
   - いまのゲームの人形は 22x22。胴は4行しかなく、服の細かい絵が描けない。
     ここでは 32x32 に増やして、胴を8行にしている。
   - 体の寸法(リグ)を3案で共通にし、服は寸法から計算して描く。
   ========================================================= */
const N=32, SP=34;               // 絵は 32x32。縁取りを付けて 34x34 の canvas にする
const INK='#6a4a62',GOLD='#f3c850',CR='#fff6e6',E1='#4a3a5a';

function shade(c,a){
  if(c.length===4)c='#'+c.slice(1).replace(/./g,m=>m+m);
  const n=parseInt(c.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(a<0){r*=1+a;g*=1+a*.85;b*=1+a*.6;}else{r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}
  return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
}
class D{
  constructor(){this.g=Array.from({length:N},()=>Array(N).fill(null));}
  p(x,y,c){x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<N&&y<N)this.g[y][x]=c;}
  r(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.p(x+i,y+j,c);}
  e(cx,cy,rx,ry,c,sh=true){
    for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
      const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;
      if(dx*dx+dy*dy<=1.0001){const u=dx*.6+dy*.8;this.p(x,y,(!sh||c===null)?c:u>.6?shade(c,-.1):u<-.65?shade(c,.14):c);}
    }
  }
  l(x1,y1,x2,y2,c){const n=Math.max(Math.abs(x2-x1),Math.abs(y2-y1))||1;for(let i=0;i<=n;i++)this.p(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n,c);}
}

/* ---- 左右対称の道具。対称の軸は マス15 と マス16 のあいだ(34x34の中心) ----
   マス x の反対側は 31-x */
const MX=x=>31-x;
const mp=(d,x,y,c)=>{d.p(x,y,c);d.p(MX(x),y,c);};
const mr=(d,x,y,w,h,c)=>{d.r(x,y,w,h,c);d.r(32-x-w,y,w,h,c);};
const sr=(d,y,hw,c)=>{for(let x=16-hw;x<=15+hw;x++)d.p(x,y,c);};         // 中心から左右 hw マス
const hr=(d,x0,x1,y,c)=>{for(let x=x0;x<=x1;x++)d.p(x,y,c);};

/* =========================================================
   リグ(体の寸法)。3案で共通。単位はマス
   ch あご  ty0..ty1 どうたい  tw[] 行ごとの半分の幅
   ax,aw うで(左うでの左端は 16-ax)  ly0 足のつけね  lx,lw 足  fy0..fy1 くつ
   ========================================================= */
const BODY={ch:16,ty0:17,ty1:24,tw:[4,5,5,5,5,5,5,6],ax:8,aw:3,ay0:17,ay1:23,ly0:25,lx:5,lw:4,fy0:29,fy1:31};
const ANIMALS={
 rabbit:{key:'rabbit',name:'うさぎ',sub:'長い耳。耳が高いので帽子は耳のあいだに乗る。いちばん「かわいい」寄り。',
   fur:'#fff1f0',inner:'#ffb8c8',ht:6,hy:11.5,hrx:8,hry:5.7,ey:10,ex:11},
 bear:{key:'bear',name:'くま',sub:'まるい耳とまるい顔。顔が大きく、体との釣り合いが一番「ぬいぐるみ」らしい。',
   fur:'#c98a5a',inner:'#e8b890',ht:3,hy:10,hrx:8.5,hry:7,ey:10,ex:11},
 cat:{key:'cat',name:'ねこ',sub:'とがった耳と、しっぽ。ひげと縞で、他の2案よりキャラの違いが出る。',
   fur:'#f0b070',inner:'#ffb0b8',ht:5,hy:11,hrx:8,hry:5.8,ey:10,ex:11},
};
for(const k in ANIMALS)Object.assign(ANIMALS[k],BODY);
const hwAt=(R,y)=>R.tw[Math.max(0,Math.min(R.tw.length-1,y-R.ty0))];
const armL=R=>16-R.ax, armR=R=>15+R.ax, legL=R=>16-R.lx;

/* =========================================================
   体を描く
   ========================================================= */
function bodyLayers(R,P){
  const fur=P.fur||R.fur,fu2=shade(fur,-.14),fu3=shade(fur,-.26),belly=shade(fur,.42);
  const back=new D(),b=new D();
  // --- しっぽ(うしろ) ---
  if(R.key==='cat'){
    for(const [x,y] of [[22,29],[23,30],[24,30],[25,29],[26,28],[27,26],[27,24],[26,22]])back.r(x-(x>25?0:0),y-1,2,2,fur);
    back.r(26,21,2,2,fu3);back.r(27,24,1,3,fu2);
  }
  if(R.key==='rabbit'){back.e(23.5,27.5,2.6,2.6,'#ffffff');back.p(22,26,'#f0eaff');}
  // --- 足 ---
  mr(b,legL(R),R.ly0,R.lw,R.fy0-R.ly0,fur);
  mr(b,legL(R)-1,R.fy0,R.lw+1,3,fur);
  mp(b,legL(R)-1,R.fy0,null);                                       // つま先を丸く
  mr(b,legL(R)-1,R.fy1,R.lw+1,1,fu2);
  mp(b,legL(R)+1,R.fy1,R.key==='cat'?'#ffb0b8':fu3);mp(b,legL(R)+2,R.fy1,R.key==='cat'?'#ffb0b8':fu3);   // にくきゅう
  mr(b,legL(R)+R.lw-1,R.ly0+1,1,R.fy0-R.ly0-1,fu2);                 // 足の内がわの影
  // --- どうたい ---
  for(let y=R.ty0;y<=R.ty1;y++)sr(b,y,hwAt(R,y),fur);
  b.e(16,21.2,3.6,3.6,belly,false);
  for(let y=R.ty0;y<=R.ty1;y++){b.p(16-hwAt(R,y),y,fu2);b.p(15+hwAt(R,y),y,fu2);}
  mp(b,16-hwAt(R,R.ty0),R.ty0,null);
  // --- うで ---
  mr(b,armL(R),R.ay0,R.aw,R.ay1-R.ay0+1,fur);
  mr(b,armL(R),R.ay0+1,1,R.ay1-R.ay0,fu2);                           // うでの外がわの影
  mp(b,armL(R),R.ay1,null);                                          // 手の先を丸く
  mr(b,armL(R)+1,R.ay1,1,1,belly);                                   // てのひら
  return {back,body:b,head:headLayer(R,P),ears:earsLayer(R,P)};
}

function earsLayer(R,P){
  const d=new D(),fur=P.fur||R.fur,fu2=shade(fur,-.14),inn=R.inner;
  if(R.key==='rabbit'){
    for(let y=0;y<=9;y++){
      const cx=11.6+1.4*(y/9),hw=y<2?1.3:2.1;
      const x0=Math.round(cx-hw),x1=Math.round(cx+hw)-1;
      hr(d,x0,x1,y,y>=7?fu2:fur);mp(d,x0,y,null);mp(d,x0,y,null);
      hr(d,x0,x1,y,fur);mp(d,x0,y,fu2);   // 外がわのふち
      if(y>=2&&y<=8){hr(d,Math.round(cx-1),Math.round(cx)  ,y,inn);}
    }
    // 右がわは左の鏡
    const g=d.g;for(let y=0;y<N;y++)for(let x=0;x<16;x++)g[y][MX(x)]=g[y][x];
    return d;
  }
  if(R.key==='bear'){
    d.e(10,5,3.2,3.2,fur);d.e(10.3,5.5,1.7,1.7,inn,false);
    d.e(21,5,3.2,3.2,fur);d.e(20.7,5.5,1.7,1.7,inn,false);
    return d;
  }
  // cat
  const L=[[2,9,10],[3,9,11],[4,8,12],[5,8,13],[6,8,14]],I=[[3,10,10],[4,10,11],[5,10,12],[6,10,12]];
  for(const [y,a,c] of L){hr(d,a,c,y,fur);d.p(a,y,fu2);}
  for(const [y,a,c] of I)hr(d,a,c,y,inn);
  const g=d.g;for(let y=0;y<N;y++)for(let x=0;x<16;x++)if(g[y][x])g[y][MX(x)]=g[y][x];
  return d;
}

function headLayer(R,P){
  const d=new D(),fur=P.fur||R.fur,fu2=shade(fur,-.12),fu3=shade(fur,-.26),hl=shade(fur,.35),muz=shade(fur,.55);
  d.e(16,R.hy,R.hrx,R.hry,fur);
  // あごのかげ・ほっぺの毛
  hr(d,16-Math.floor(R.hrx)+2,15+Math.floor(R.hrx)-2,R.hy+Math.floor(R.hry),fu2);
  const ex=R.ex,ey=R.ey;
  if(R.key==='rabbit'){
    d.e(16,14.3,3.9,2.4,'#fffafa',false);                              // くち元
    mr(d,ex,ey,2,3,E1);mp(d,ex,ey,'#ffffff');mp(d,ex+1,ey+2,'#9a7ac0');   // め
    mr(d,ex-3,ey+3,3,1,'#ffb0c0');mr(d,ex-3,ey+4,2,1,'#ffc8d4');       // ほっぺ
    d.r(15,13,2,1,'#ff8fa0');                                           // はな
    mp(d,14,14,E1);d.r(15,15,2,1,E1);                                   // くち(ω)
    mp(d,13,15,null);
  }else if(R.key==='bear'){
    d.e(16,14.2,5.2,3.6,'#f7e3c4',false);                               // くち元
    mr(d,ex,ey,2,3,E1);mp(d,ex,ey,'#ffffff');
    mr(d,ex-3,ey+3,3,1,'#f0a090');
    d.r(14,12,4,1,E1);d.r(15,13,2,1,E1);mp(d,15,12,'#7a6a8a');          // はな
    d.r(15,14,2,1,E1);mp(d,13,15,E1);d.r(14,16,4,1,null);mp(d,14,15,E1);   // くち
  }else{
    mr(d,ex,ey,2,3,E1);mp(d,ex,ey,'#ffffff');mp(d,ex+1,ey+2,'#5a9a6a');
    mr(d,ex-3,ey+3,3,1,'#ffb0b8');
    d.r(15,13,2,1,'#ff8fa0');mp(d,13,14,E1);mp(d,14,15,E1);mp(d,15,15,E1);   // はな・くち(わらった口)
    // ひげ
    for(const y of [12,14]){hr(d,5,8,y,fu3);mp(d,5,y,fu3);}
    for(let x=5;x<=7;x++){d.p(x,12,fu3);d.p(MX(x),12,fu3);}
    // しま
    mr(d,13,R.ht+1,1,2,fu3);d.r(15,R.ht+1,2,3,fu3);mr(d,12,R.ht+2,1,1,fu3);
  }
  return d;
}

/* =========================================================
   服(ぜんぶリグ R から計算する)
   ========================================================= */
const SLOTS={back:{z:-2},feet:{z:0},bottom:{z:1},body:{z:2},neck:{z:3},bag:{z:4},held:{z:-1},face:{z:5},head:{z:6},hand:{z:7},wand:{z:8}};
const ITEMS=[
 ['head','hat','ぼうし','hat',null,'#e8a0b8'],
 ['head','helmet','ヘルメット','hat','helmet','#f3c850'],
 ['head','ribbon','リボン','ribbon',null,'#e8606a'],
 ['head','crown','かんむり','crown',null,GOLD],
 ['head','tiara','ティアラ','tiara',null,'#ff8fb0'],
 ['head','startiara','ほしのティアラ','startiara',null,'#ffd84a'],
 ['head','flowercrown','はなかんむり','flowercrown',null,'#ff8fb0'],
 ['face','glasses','めがね','glasses',null,'#c08f3a'],
 ['neck','tie','ネクタイ','tie',null,'#5a8ad8'],
 ['neck','muffler','マフラー','muffler',null,'#e8465a'],
 ['body','shirt','シャツ','shirt',null,'#9ac8f0'],
 ['body','sweater','セーター','shirt','sweater','#f0b878'],
 ['body','dress','ドレス','shirt','dress','#f0a0c8'],
 ['body','apron','エプロン','shirt','apron','#f0a0c8'],
 ['body','cape','マント','shirt','cape','#8a7ad8'],
 ['body','yukata','ゆかた','yukata',null,'#7fa8e8'],
 ['body','coat','コート','coat',null,'#c8956a'],
 ['body','pajama','パジャマ','pajama',null,'#bfe0f8'],
 ['body','rainbowdress','にじいろドレス','rainbowdress',null,'#ffffff'],
 ['body','starcape','ほしぞらマント','starcape',null,'#2e2e70'],
 ['bottom','skirt','スカート','skirt',null,'#e86a8a'],
 ['bottom','pants','ズボン','pants',null,'#5a7ac8'],
 ['feet','shoe','くつ','shoe',null,'#e8606a'],
 ['feet','boots','ブーツ','shoe','tall','#9a6a5a'],
 ['feet','socks','くつした','socks',null,'#ffffff'],
 ['feet','geta','げた','geta',null,'#e8465a'],
 ['feet','sandal','サンダル','sandal',null,'#ffb347'],
 ['feet','glassshoe','ガラスのくつ','glassshoe',null,'#d8f4ff'],
 ['hand','glove','てぶくろ','glove',null,'#e8606a'],
 ['bag','bag','かばん','bag',null,'#c8784a'],
 ['back','wings','ようせいのはね','wings',null,'#d8f0ff'],
 ['wand','wand','まほうのつえ','wand',null,'#c89a6a'],
 ['held','umbrella','かさ','umbrella',null,'#8fb8e8'],
];
const FIXED_COLOR=new Set(['crown','startiara','flowercrown','rainbowdress','starcape','wings','wand','glassshoe']);
// 耳を服の上に出す(耳が帽子の穴から出ているように見せる)
const EAR_THROUGH=new Set(['hat','helmet','crown','tiara','startiara','flowercrown']);

const WEAR={
/* ---------- あたま ---------- */
hat(d,R,o){
  const c=o.c,t=o.t,T=R.ht,h=Math.round(R.hrx),lo=shade(c,-.25),hi=shade(c,.4);
  if(t==='helmet'){
    [[T-3,h-4],[T-2,h-2],[T-1,h],[T,h+1]].forEach(([y,w])=>sr(d,y,w,c));
    for(let y=T+1;y<=R.ey-2;y++)sr(d,y,h+1,c);
    sr(d,R.ey-2,h+2,lo);sr(d,R.ey-3,h+1,shade(c,-.1));                      // ひさし
    for(let y=R.ey-1;y<=R.ey+4;y++){hr(d,16-h-1,16-h,y,c);hr(d,15+h,15+h+1,y,c);}   // みみあて
    mr(d,16-h-1,R.ey+4,2,1,lo);
    d.r(15,T-5,2,3,hi);d.r(15,T-3,2,1,lo);                                 // とさか
    d.r(14,R.ey-6,4,3,'#e8465a');d.r(14,R.ey-6,4,1,'#ff9aa8');d.p(15,R.ey-5,'#ffffff');   // バッジ
    for(let x=16-h+1;x<=15+h-1;x+=3)d.p(x,T-1,hi);                          // つや
    return;}
  [[T-3,h-3],[T-2,h-1],[T-1,h],[T,h+1],[T+1,h+1]].forEach(([y,w])=>sr(d,y,w,c));
  sr(d,T+1,h+1,lo);                                                         // 帯
  for(let x=16-h+1;x<=15+h-1;x+=3)d.p(x,T+1,shade(c,-.1));
  hr(d,16-h-3,15+h+3,T+2,shade(c,-.1));hr(d,16-h-2,15+h+2,T+3,lo);            // つば
  hr(d,16-h-3,15+h+3,T+2,c);
  mp(d,16-h-3,T+2,hi);mp(d,16-h-2,T+2,hi);

  if(!tall){mp(d,x+3,R.fy0,CR);mp(d,x+3,R.fy0+1,shade(c,-.12));mp(d,x+2,R.fy0+1,CR);}   // ひも
  mp(d,x+4,R.fy1,shade(c,-.45));
},
socks(d,R,o){
  const c=o.c,c2=o.c2||'#ff8fb0',x=legL(R)-1;
  mr(d,legL(R),R.fy0-3,R.lw,3,c);mr(d,legL(R),R.fy0-3,R.lw,1,c2);mr(d,legL(R),R.fy0-2,R.lw,1,shade(c,-.1));
  mr(d,x,R.fy0,R.lw+1,3,c);mp(d,x,R.fy0,null);
  mr(d,x,R.fy1,R.lw+1,1,shade(c,-.18));
  mp(d,legL(R),R.fy0-1,c2);mp(d,legL(R)+2,R.fy0-1,c2);
  mp(d,x+4,R.fy0+1,shade(c,-.12));mp(d,x+4,R.fy0+2,shade(c,-.18));
},
geta(d,R,o){
  const c=o.c,w='#d8a870',x=legL(R)-1,dk=shade(w,-.3);
  mr(d,x,R.fy1-1,R.lw+1,1,shade(w,.2));mr(d,x,R.fy1-1,R.lw+1,1,w);
  mr(d,x,R.fy1,1,1,dk);mr(d,x+4,R.fy1,1,1,dk);mr(d,x+1,R.fy1,3,1,null);
  mp(d,x+2,R.fy0,c);mp(d,x+2,R.fy0+1,c);mp(d,x+1,R.fy0+1,c);mp(d,x+3,R.fy0+1,c);mp(d,x+2,R.fy0-1,c);
  mp(d,x,R.fy1-1,shade(w,.35));
},
sandal(d,R,o){
  const c=o.c,x=legL(R)-1,hi=shade(c,.45);
  mr(d,x,R.fy1,R.lw+1,1,c);mr(d,x,R.fy1-1,R.lw+1,1,shade(c,-.2));mr(d,x,R.fy1-1,1,1,null);mp(d,x,R.fy1-1,null);
  mp(d,x+1,R.fy1-1,c);mp(d,x+3,R.fy1-1,c);
  mp(d,x+2,R.fy0,c);mp(d,x+2,R.fy0+1,hi);mp(d,x+1,R.fy0+1,c);
  mr(d,legL(R),R.fy0-1,R.lw,1,c);mp(d,legL(R)+R.lw-1,R.fy0-1,GOLD);mp(d,legL(R),R.fy0-2,hi);
},
glassshoe(d,R,o){
  const g='#d8f4ff',x=legL(R)-1,g2='#9ad0f0';
  mr(d,legL(R),R.fy0-2,R.lw,2,g);mr(d,legL(R),R.fy0-2,R.lw,1,'#ffffff');
  mr(d,x,R.fy0,R.lw+1,3,g);mp(d,x,R.fy0,null);mr(d,x,R.fy1,R.lw+1,1,g2);mr(d,x,R.fy1-1,R.lw+1,1,shade(g,-.08));
  mp(d,x+1,R.fy0,'#ffffff');mp(d,x+2,R.fy0+1,'#ffffff');mp(d,x+3,R.fy0,'#ff8fb0');mp(d,legL(R)+1,R.fy0-1,'#ff8fb0');
  mp(d,x+4,R.fy1,'#7ab0d8');
},
/* ---------- て・もちもの ---------- */
glove(d,R,o){
  const c=o.c,y=R.ay1,x=armL(R)-1,w=R.aw+1,hi=shade(c,.4),lo=shade(c,-.2);
  mr(d,x,y-3,w,2,hi);mr(d,x,y-1,w,2,c);mr(d,x,y+0,w,1,c);
  mp(d,x,y,null);mr(d,x,y-1,1,1,lo);
  mr(d,x+1,y-3,1,2,shade(hi,.2));
  mr(d,x,y-1,w,1,c);mr(d,x+2,y-1,1,2,shade(c,-.1));
},
bag(d,R,o){
  const c=o.c,s='#8a5a3a',lo=shade(c,-.25),hi=shade(c,.4);
  d.l(12,R.ty0,22,R.ty1-2,s);d.l(13,R.ty0,23,R.ty1-2,s);
  const bx=20,by=R.ty1-2;
  d.r(bx,by,7,7,c);d.r(bx,by,7,3,lo);d.r(bx,by+3,7,1,shade(c,-.1));
  d.r(bx+3,by+2,1,2,GOLD);d.p(bx+3,by+2,shade(GOLD,.4));
  d.r(bx+1,by+5,5,1,hi);d.p(bx,by+6,lo);d.r(bx,by+6,7,1,lo);
  for(const y of [by+4])for(let x=bx+1;x<=bx+5;x+=2)d.p(x,y,hi);
},
/* ---------- うしろ・もつ ---------- */
wings(d,R,o){
  const a='#d8f0ff',b='#f0d8ff',T=R.ty0,v='#ffffff';
  for(const s of [0,1]){
    const cx=s?MX(16-R.ax-3):16-R.ax-3,sg=s?1:-1;
    d.e(cx,T+1,3.7,6.4,a);d.e(cx-sg*0.5,T+8,2.7,3.2,b);
    d.l(cx,T-3,cx-sg*1,T+7,v);d.l(cx,T-1,cx+sg*2,T+3,shade(a,-.12));
    d.p(cx-sg,T,v);d.p(cx+sg,T+4,v);d.p(cx,T+9,v);
  }
},
wand(d,R,o){
  const hx=armR(R)-1,hy=R.ay1,tx=Math.min(28,hx+5),ty=Math.max(9,hy-12),Y='#ffd84a';
  d.l(hx,hy,tx,ty,'#c89a6a');d.l(hx+1,hy,tx+1,ty,'#c89a6a');d.l(hx,hy-1,tx,ty-1,shade('#c89a6a',.25));
  d.p(tx,ty-7,Y);d.r(tx-1,ty-6,3,1,Y);d.r(tx-1,ty-5,3,1,Y);d.r(tx-3,ty-4,7,1,Y);d.r(tx-2,ty-3,5,1,Y);d.r(tx-1,ty-2,3,1,Y);d.p(tx-2,ty-1,Y);d.p(tx+2,ty-1,Y);
  d.p(tx,ty-5,'#ffffff');d.p(tx-1,ty-4,'#ffffff');d.p(tx-4,ty-6,'#ffffff');d.p(tx+4,ty-3,'#ffffff');d.p(tx-3,ty-2,'#ff8fb0');
  d.r(hx+2,hy-4,2,1,'#ff8fb0');
},
umbrella(d,R,o){
  const c=o.c,px=armR(R),cx=Math.min(px+1,24);
  d.l(px,5,px,R.ay1+1,'#a8785a');d.p(px-1,R.ay1+2,'#a8785a');
  d.e(cx,4,7,4.2,c);d.r(0,7,32,10,null);
  for(let i=-5;i<=5;i+=5)d.e(cx+i+.5,7,2.6,1.4,c);
  for(const dx of [-4,-2,0,2,4])d.l(cx+dx,1,cx+dx*1.2,7,shade(c,.3));
  d.p(cx,0,GOLD);d.r(cx-6,5,12,1,shade(c,-.12));
},
};

/* =========================================================
   合成(ふちどり3方式)
   ========================================================= */
function bakeD(d){
  const cv=document.createElement('canvas');cv.width=cv.height=SP;const x=cv.getContext('2d');
  const f=(i,j)=>(d.g[j-1]&&d.g[j-1][i-1])||null;
  for(let j=1;j<=N;j++)for(let i=1;i<=N;i++){const c=f(i,j);if(c){x.fillStyle=c;x.fillRect(i,j,1,1);}}
  x.fillStyle=INK;
  for(let j=0;j<SP;j++)for(let i=0;i<SP;i++)if(!f(i,j)&&(f(i+1,j)||f(i-1,j)||f(i,j+1)||f(i,j-1)))x.fillRect(i,j,1,1);
  return cv;
}
function blit(dst,src){for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(src.g[y][x])dst.g[y][x]=src.g[y][x];}
function innerEdge(dst,layer){
  const out=layer.g.map(r=>r.slice());
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const c=layer.g[y][x];if(!c)continue;
    let touch=false;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=N||ny>=N)continue;
      if(!layer.g[ny][nx]&&dst.g[ny][nx]){touch=true;break;}
    }
    if(touch)out[y][x]=shade(c,-.3);
  }
  layer.g=out;
}
function makeLayers(R,P,outfit){
  const body=bodyLayers(R,P),front=[],behind=[];
  for(const [slot,id,nm,k,t,c0] of ITEMS){
    if(outfit[slot]!==id)continue;
    const o={c:P.col&&!FIXED_COLOR.has(id)?P.col:c0,t,k:id};
    const d=new D();WEAR[k](d,R,o);
    (slot==='back'?behind:front).push({d,z:SLOTS[slot].z,slot});
  }
  // 耳は頭の上に重ねる(輪郭が出る)。帽子のときは帽子より手前に出して、穴から出ているように見せる
  front.push({d:body.ears,z:(outfit.head&&EAR_THROUGH.has(outfit.head))?6.5:.5,slot:'ears'});
  behind.sort((a,b)=>a.z-b.z);front.sort((a,b)=>a.z-b.z);
  return {body,front,behind};
}
function renderDoll(form,P,outfit,mode){
  const R=ANIMALS[form],L=makeLayers(R,P,outfit);
  if(mode==='3'){
    const cv=document.createElement('canvas');cv.width=cv.height=SP;const x=cv.getContext('2d');
    const bodyAll=new D();blit(bodyAll,L.body.back);blit(bodyAll,L.body.body);blit(bodyAll,L.body.head);
    for(const l of L.behind)x.drawImage(bakeD(l.d),0,0);
    x.drawImage(bakeD(bodyAll),0,0);
    for(const l of L.front)x.drawImage(bakeD(l.d),0,0);
    return cv;
  }
  const all=new D();
  for(const l of L.behind){if(mode==='2')innerEdge(all,l.d);blit(all,l.d);}
  blit(all,L.body.back);blit(all,L.body.body);blit(all,L.body.head);
  for(const l of L.front){if(mode==='2')innerEdge(all,l.d);blit(all,l.d);}
  return bakeD(all);
}

/* =========================================================
   画面
   ========================================================= */
const $=s=>document.querySelector(s);
const FURS=[['もとのいろ',null],['しろ','#fff1f0'],['ちゃいろ','#c98a5a'],['オレンジ','#f0b070'],['はいいろ','#b8b4c8'],['くろ','#5a4e66'],['ピンク','#f2a7b8']];
const COLORS=[['もとのいろ',null],['あか','#e8606a'],['ももいろ','#f5a0c0'],['だいだい','#ffa850'],['きいろ','#ffd84a'],['みどり','#7fcf8f'],['みずいろ','#8fd0f0'],['あお','#6a8ad8'],['むらさき','#a88ae0']];
const fill=(sel,list)=>{sel.innerHTML=list.map(([n],i)=>`<option value="${i}">${n}</option>`).join('');};
fill($('#cFur'),FURS);fill($('#cCol'),COLORS);
const P=()=>({fur:FURS[$('#cFur').value][1],col:COLORS[$('#cCol').value][1]});
const SLOT_LABEL={head:'あたま',face:'かお',neck:'くび',body:'からだ',bottom:'した',feet:'あし',hand:'て',bag:'かばん',back:'せなか',wand:'つえ',held:'かさ'};
const SLOT_ORDER=['head','face','neck','body','bottom','feet','hand','bag','back','wand','held'];
const outfit={};

function drawOnto(cv,sprite,scale,R){
  const s=SP*scale;cv.width=s;cv.height=s;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;
  x.drawImage(sprite,0,0,s,s);
  if($('#cGrid').checked){x.strokeStyle='#0002';x.lineWidth=1;x.beginPath();
    for(let i=0;i<=SP;i++){x.moveTo(i*scale+.5,0);x.lineTo(i*scale+.5,s);x.moveTo(0,i*scale+.5);x.lineTo(s,i*scale+.5);}x.stroke();}
  if($('#cRig').checked&&R){
    const row=(y,col,label)=>{const py=(y+1)*scale;x.strokeStyle=col;x.lineWidth=1.5;x.beginPath();x.moveTo(0,py+.5);x.lineTo(s,py+.5);x.stroke();
      x.fillStyle=col;x.font='bold 11px sans-serif';x.fillText(label,2,py-2);};
    row(R.ht,'#e0407a','あたま');row(R.ch+1,'#d08020','あご');row(R.ty0,'#2a9a5a','かた');row(R.ty1+1,'#2a7ac0','こし');row(R.ly0,'#7a4ac0','あしのつけね');row(R.fy0,'#c04a4a','くつ');
    x.strokeStyle='#e0407a88';x.beginPath();x.moveTo(16*scale+.5,0);x.lineTo(16*scale+.5,s);x.stroke();
  }
}
function previewBlock(sprite,R){
  const wrap=document.createElement('div');wrap.className='stage '+$('#cBg').value;
  const big=document.createElement('canvas'),small=document.createElement('canvas');
  drawOnto(big,sprite,+$('#cScale').value,R);
  const V=+$('#cGame').value;
  small.width=small.height=V;const sx=small.getContext('2d');sx.imageSmoothingEnabled=false;sx.drawImage(sprite,0,0,V,V);
  wrap.appendChild(big);wrap.appendChild(small);return wrap;
}
function card(title,sub){const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>${title}</h3><small>${sub||''}</small>`;return c;}
function renderForms(){
  const box=$('#forms');box.innerHTML='';
  for(const k of Object.keys(ANIMALS)){const R=ANIMALS[k],c=card(R.name,R.sub);
    c.appendChild(previewBlock(renderDoll(k,P(),{},$('#cEdge').value),R));box.appendChild(c);}
}
function renderDress(){
  const box=$('#dress');box.innerHTML='';
  for(const k of Object.keys(ANIMALS)){const R=ANIMALS[k],c=card(R.name,'');c.querySelector('small').style.minHeight='0';
    c.appendChild(previewBlock(renderDoll(k,P(),outfit,$('#cEdge').value),R));box.appendChild(c);}
}
function renderOutfitUI(){
  const box=$('#outfit');box.innerHTML='';
  for(const slot of SLOT_ORDER){
    const lab=document.createElement('label');lab.textContent=SLOT_LABEL[slot];
    const sel=document.createElement('select');
    sel.innerHTML='<option value="">(なし)</option>'+ITEMS.filter(i=>i[0]===slot).map(i=>`<option value="${i[1]}">${i[2]}</option>`).join('');
    sel.value=outfit[slot]||'';
    sel.onchange=()=>{if(sel.value)outfit[slot]=sel.value;else delete outfit[slot];renderDress();};
    lab.appendChild(sel);box.appendChild(lab);
  }
}
const PRESETS=[
 ['はだか',{}],
 ['ふだんぎ',{body:'shirt',bottom:'pants',feet:'shoe'}],
 ['おんなのこ',{head:'ribbon',body:'shirt',bottom:'skirt',feet:'socks',bag:'bag'}],
 ['ドレス',{head:'tiara',body:'dress',feet:'glassshoe'}],
 ['ゆかた',{body:'yukata',feet:'geta'}],
 ['ふゆ',{head:'hat',neck:'muffler',body:'coat',bottom:'pants',feet:'boots',hand:'glove'}],
 ['パジャマ',{body:'pajama',feet:'socks'}],
 ['まほうつかい',{head:'startiara',body:'starcape',bottom:'skirt',feet:'boots',wand:'wand'}],
 ['ようせい',{head:'flowercrown',body:'rainbowdress',feet:'sandal',back:'wings'}],
 ['かさ',{body:'sweater',bottom:'skirt',feet:'shoe',held:'umbrella'}],
 ['めがね',{face:'glasses',neck:'tie',body:'shirt',bottom:'pants',feet:'shoe'}],
 ['ぜんぶのせ',{head:'crown',face:'glasses',neck:'muffler',body:'apron',bottom:'skirt',feet:'boots',hand:'glove',bag:'bag',back:'wings',wand:'wand'}],
];
function renderPresets(){
  const box=$('#presets');box.innerHTML='';
  for(const [n,o] of PRESETS){const b=document.createElement('button');b.textContent=n;
    b.onclick=()=>{for(const k of Object.keys(outfit))delete outfit[k];Object.assign(outfit,o);renderOutfitUI();renderDress();};box.appendChild(b);}
}
function renderMatrix(){
  const box=$('#matrix');box.innerHTML='';
  box.insertAdjacentHTML('beforeend','<div></div>'+Object.values(ANIMALS).map(f=>`<div class="hd">${f.name}</div>`).join(''));
  const scale=Math.min(+$('#cScale').value,5);
  let last='';
  for(const [slot,id,nm,k,t,c0] of ITEMS){
    if(slot!==last){last=slot;box.insertAdjacentHTML('beforeend',`<div class="slot">${SLOT_LABEL[slot]}</div>`);}
    const label=document.createElement('div');label.className='nm';
    label.innerHTML=`${nm}<small><span class="swatch" style="background:${c0}"></span> ${id}</small>`;box.appendChild(label);
    for(const fk of Object.keys(ANIMALS)){
      const cell=document.createElement('div');cell.className='cell '+$('#cBg').value;
      const cv=document.createElement('canvas');drawOnto(cv,renderDoll(fk,P(),{[slot]:id},$('#cEdge').value),scale,ANIMALS[fk]);
      cell.appendChild(cv);box.appendChild(cell);
    }
  }
}
function renderAll(){renderForms();renderDress();renderMatrix();}
for(const id of ['#cFur','#cCol','#cEdge','#cScale','#cGame','#cBg','#cGrid','#cRig'])$(id).addEventListener('change',renderAll);
Object.assign(outfit,PRESETS[2][1]);
renderPresets();renderOutfitUI();renderAll();
</script>
